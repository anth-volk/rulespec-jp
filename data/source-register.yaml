      - 及び雑所得の金額
  - citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/28
    snapshot_sha256: 328d5dfb252bc80b801a1245c1c0017bc716ff10808849428b05053add14986e
    excerpts:
      - 収入金額が百八十万円以下である場合
      - 当該収入金額の百分の四十に相当する金額
      - 当該金額が六十五万円に満たない場合には、六十五万円
      - 収入金額が百八十万円を超え三百六十万円以下である場合
      - 七十二万円と当該収入金額から百八十万円を控除した金額の百分の三十に相当する金額との合計額
      - 収入金額が三百六十万円を超え六百六十万円以下である場合
      - 百二十六万円と当該収入金額から三百六十万円を控除した金額の百分の二十に相当する金額との合計額
      - 収入金額が六百六十万円を超え千万円以下である場合
      - 百八十六万円と当該収入金額から六百六十万円を控除した金額の百分の十に相当する金額との合計額
      - 収入金額が千万円を超える場合二百二十万円
