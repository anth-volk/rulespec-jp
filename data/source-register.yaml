  - citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/35
    snapshot_sha256: 328d5dfb252bc80b801a1245c1c0017bc716ff10808849428b05053add14986e
    excerpts:
      - 一五十万円
      - 当該残額が三百六十万円以下である場合
      - 当該残額の百分の二十五に相当する金額
      - 当該残額が三百六十万円を超え、七百二十万円以下である場合
      - 九十万円と当該残額から三百六十万円を控除した金額の百分の十五に相当する金額との合計額
      - 百四十四万円と当該残額から七百二十万円を控除した金額の百分の五に相当する金額との合計額
      - 当該合計額が七十万円に満たないときは、七十万円とする
  - citation_path: jp/statute/e-gov/332ac0000000026/as-of/2017-04-01/article/41-15-3
    snapshot_sha256: d9a1fa7290b36d691e082332cce1536fd5d716f27ad9ed041f2ea9390b02ab91
