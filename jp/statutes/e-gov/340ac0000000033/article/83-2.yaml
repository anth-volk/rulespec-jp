format: rulespec/v1
imports:
  - jp:statutes/e-gov/340ac0000000033/article/5
  - jp:statutes/e-gov/340ac0000000033/article/83
module:
  summary: >-
    National special spouse deduction from 2017-04-01, including the 2017
    statutory schedule, the 2018 expansion and taxpayer-income taper, the 2020
    and 2025 spouse-income thresholds, and the enacted 2026 threshold. The
    schedule is represented by its full-tier amount and the exact two-thirds
    and one-third taxpayer tiers, rounded upward to JPY 10,000 as shown by the
    official NTA matrices.
  source_verification:
    corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83-2
    source_sha256: 328d5dfb252bc80b801a1245c1c0017bc716ff10808849428b05053add14986e
  proof_validation:
    required: true
units:
  - {name: JPY, kind: currency, minor_units: 0}
rules:
  - name: japan_pit_special_spouse_lower_exclusive
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83-2, excerpt: "控除対象配偶者に該当しないものを有する場合"}}
          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-8, excerpt: "38万円超 85万円以下"}}
          - {path: "versions[2].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-7, excerpt: "48万円超 95万円以下"}}
          - {path: "versions[3].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-6, excerpt: "58万円超 95万円以下"}}
          - {path: "versions[4].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/reform/2026/document-1, excerpt: "配偶者特別控除の対象となる配偶者 62 万円超 133 万円以下"}}
    versions:
      - {effective_from: '2017-04-01', formula: '380000'}
      - {effective_from: '2018-01-01', formula: '380000'}
      - {effective_from: '2020-01-01', formula: '480000'}
      - {effective_from: '2025-01-01', formula: '580000'}
      - {effective_from: '2026-01-01', formula: '620000'}
  - name: japan_pit_special_spouse_full_amount_upper
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83-2, excerpt: "合計所得金額が四十万円未満である配偶者三十八万円"}}
          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-8, excerpt: "38万円超 85万円以下 38万円"}}
          - {path: "versions[2].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-7, excerpt: "48万円超 95万円以下 38万円"}}
    versions:
      - {effective_from: '2017-04-01', formula: '399999'}
      - {effective_from: '2018-01-01', formula: '850000'}
      - {effective_from: '2020-01-01', formula: '950000'}
  - name: japan_pit_special_spouse_terminal_band_lower
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83-2, excerpt: "合計所得金額が七十五万円以上である配偶者三万円"}}
          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-8, excerpt: "120万円超 123万円以下 3万円"}}
          - {path: "versions[2].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-7, excerpt: "130万円超 133万円以下 3万円"}}
    versions:
      - {effective_from: '2017-04-01', formula: '750000'}
      - {effective_from: '2018-01-01', formula: '1200000'}
      - {effective_from: '2020-01-01', formula: '1300000'}
  - name: japan_pit_special_spouse_eligibility_upper
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83-2, excerpt: "七十六万円未満であるもの"}}
          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-8, excerpt: "120万円超 123万円以下"}}
          - {path: "versions[2].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-7, excerpt: "130万円超 133万円以下"}}
    versions:
      - {effective_from: '2017-04-01', formula: '759999'}
      - {effective_from: '2018-01-01', formula: '1230000'}
      - {effective_from: '2020-01-01', formula: '1330000'}
  - name: japan_pit_special_spouse_full_deduction_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83-2, excerpt: "合計所得金額が四十万円未満である配偶者三十八万円"}}
    versions:
      - {effective_from: '2017-04-01', formula: '380000'}
  - name: japan_pit_special_spouse_first_step_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-8, excerpt: "85万円超 90万円以下 36万円 24万円 12万円"}}
    versions:
      - {effective_from: '2017-04-01', formula: '360000'}
  - name: japan_pit_special_spouse_band_decrement
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83-2, excerpt: "五万円の整数倍の金額から三万円を控除した金額で当該超える部分の金額に満たないもののうち最も多い金額"}}
    versions:
      - {effective_from: '2017-04-01', formula: '50000'}
  - name: japan_pit_special_spouse_last_step_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-8, excerpt: "115万円超 120万円以下 6万円 4万円 2万円"}}
    versions:
      - {effective_from: '2017-04-01', formula: '60000'}
  - name: japan_pit_special_spouse_terminal_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83-2, excerpt: "合計所得金額が七十五万円以上である配偶者三万円"}}
    versions:
      - {effective_from: '2017-04-01', formula: '30000'}
  - name: japan_pit_special_spouse_taxpayer_tier_rounding_unit
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-7, excerpt: "38万円 26万円 13万円"}}
    versions:
      - {effective_from: '2018-01-01', formula: '10000'}
  - name: japan_pit_special_spouse_full_tier_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_pit_spouse_total_income <= japan_pit_special_spouse_full_amount_upper:
              japan_pit_special_spouse_full_deduction_amount
          else:
              if japan_pit_spouse_total_income >= japan_pit_special_spouse_terminal_band_lower:
                  japan_pit_special_spouse_terminal_amount
              else:
                  max(japan_pit_special_spouse_last_step_amount, japan_pit_special_spouse_first_step_amount - floor((japan_pit_spouse_total_income - japan_pit_special_spouse_full_amount_upper - 1) / japan_pit_special_spouse_band_decrement) * japan_pit_special_spouse_band_decrement)
  - name: japan_pit_special_spouse_deduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: jp/guidance/nta/income-tax/special-spouse/no-1195/block-4
              excerpt: 控除を受ける納税者本人のその年における 合計所得金額 が1,000万円以下であること
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_pit_standard_resident_liability_applies and japan_pit_spouse_meets_special_deduction_non_income_conditions and japan_pit_taxpayer_total_income <= 10000000 and japan_pit_spouse_total_income > japan_pit_special_spouse_lower_exclusive and japan_pit_spouse_total_income <= japan_pit_special_spouse_eligibility_upper:
              japan_pit_special_spouse_full_tier_amount
          else:
              0
      - effective_from: '2018-01-01'
        formula: |-
          if not japan_pit_standard_resident_liability_applies or not japan_pit_spouse_meets_special_deduction_non_income_conditions or japan_pit_taxpayer_total_income > japan_pit_spouse_taxpayer_eligibility_upper or japan_pit_spouse_total_income <= japan_pit_special_spouse_lower_exclusive or japan_pit_spouse_total_income > japan_pit_special_spouse_eligibility_upper:
              0
          else:
              if japan_pit_taxpayer_total_income <= japan_pit_spouse_taxpayer_first_tier_upper:
                  japan_pit_special_spouse_full_tier_amount
              else:
                  if japan_pit_taxpayer_total_income <= japan_pit_spouse_taxpayer_second_tier_upper:
                      ceil((japan_pit_special_spouse_full_tier_amount * 2 / 3) / japan_pit_special_spouse_taxpayer_tier_rounding_unit) * japan_pit_special_spouse_taxpayer_tier_rounding_unit
                  else:
                      ceil((japan_pit_special_spouse_full_tier_amount / 3) / japan_pit_special_spouse_taxpayer_tier_rounding_unit) * japan_pit_special_spouse_taxpayer_tier_rounding_unit
