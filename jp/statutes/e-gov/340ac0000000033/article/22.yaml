module:
  summary: >-
    Wave 1 implementation of Income Tax Act article 22 general-income
    aggregation. It includes employment income, public-pension miscellaneous
    income, and the 2020 income-amount adjustment. Every other article 22
    income category and all loss offsets remain explicit zero assumptions.
  source_verification:
    corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/22
