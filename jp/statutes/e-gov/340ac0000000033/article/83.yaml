format: rulespec/v1
imports:
  - jp:statutes/e-gov/340ac0000000033/article/5
module:
  summary: >-
    National income-tax spouse deduction from 2017-04-01. The module preserves
    the pre-2018 untapered rule, the 2018 taxpayer-income taper, and the spouse
    income-limit changes for 2020, 2025, and enacted 2026 law. Whether the
    candidate satisfies the non-income legal conditions is an explicit fact.
  source_verification:
    corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83
    source_sha256: 328d5dfb252bc80b801a1245c1c0017bc716ff10808849428b05053add14986e
  proof_validation:
    required: true
units:
  - {name: JPY, kind: currency, minor_units: 0}
rules:
  - name: japan_pit_spouse_income_limit
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/2, excerpt: "合計所得金額が三十八万円以下である者"}}
          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/spouse/no-1191/block-5, excerpt: "令和２年分から令和６年分までは48万円以下"}}
          - {path: "versions[2].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/spouse/no-1191/block-5, excerpt: "年間の合計所得金額が58万円以下"}}
          - {path: "versions[3].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/reform/2026/document-1, excerpt: "扶養親族 同一生計配偶者 ひとり親の生計を一にする子 62 万円以下"}}
    versions:
      - {effective_from: '2017-04-01', formula: '380000'}
      - {effective_from: '2020-01-01', formula: '480000'}
      - {effective_from: '2025-01-01', formula: '580000'}
      - {effective_from: '2026-01-01', formula: '620000'}
  - name: japan_pit_spouse_taxpayer_first_tier_upper
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/spouse/no-1191/block-4, excerpt: "900万円以下 38万円 48万円"}}
    versions:
      - {effective_from: '2018-01-01', formula: '9000000'}
  - name: japan_pit_spouse_taxpayer_second_tier_upper
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/spouse/no-1191/block-4, excerpt: "900万円超950万円以下 26万円 32万円"}}
    versions:
      - {effective_from: '2018-01-01', formula: '9500000'}
  - name: japan_pit_spouse_taxpayer_eligibility_upper
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/spouse/no-1191/block-5, excerpt: "合計所得金額が1,000万円を超える場合は、配偶者控除は受けられません"}}
    versions:
      - {effective_from: '2018-01-01', formula: '10000000'}
  - name: japan_pit_spouse_regular_full_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83, excerpt: "その居住者のその年分の総所得金額、退職所得金額又は山林所得金額から三十八万円"}}
    versions:
      - {effective_from: '2017-04-01', formula: '380000'}
  - name: japan_pit_spouse_regular_middle_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/spouse/no-1191/block-4, excerpt: "900万円超950万円以下 26万円 32万円"}}
    versions:
      - {effective_from: '2018-01-01', formula: '260000'}
  - name: japan_pit_spouse_regular_high_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/spouse/no-1191/block-4, excerpt: "950万円超1,000万円以下 13万円 16万円"}}
    versions:
      - {effective_from: '2018-01-01', formula: '130000'}
  - name: japan_pit_spouse_elderly_full_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/83, excerpt: "老人控除対象配偶者である場合には、四十八万円"}}
    versions:
      - {effective_from: '2017-04-01', formula: '480000'}
  - name: japan_pit_spouse_elderly_middle_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/spouse/no-1191/block-4, excerpt: "900万円超950万円以下 26万円 32万円"}}
    versions:
      - {effective_from: '2018-01-01', formula: '320000'}
  - name: japan_pit_spouse_elderly_high_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/spouse/no-1191/block-4, excerpt: "950万円超1,000万円以下 13万円 16万円"}}
    versions:
      - {effective_from: '2018-01-01', formula: '160000'}
  - name: japan_pit_spouse_income_qualifies_flag
    kind: derived
    entity: Person
    dtype: Integer
    period: Year
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_pit_spouse_total_income <= japan_pit_spouse_income_limit:
              1
          else:
              0
  - name: japan_pit_spouse_deduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_pit_standard_resident_liability_applies and japan_pit_spouse_meets_non_income_conditions and japan_pit_spouse_total_income <= japan_pit_spouse_income_limit:
              if japan_pit_spouse_is_elderly:
                  japan_pit_spouse_elderly_full_amount
              else:
                  japan_pit_spouse_regular_full_amount
          else:
              0
      - effective_from: '2018-01-01'
        formula: |-
          if not japan_pit_standard_resident_liability_applies or not japan_pit_spouse_meets_non_income_conditions or japan_pit_spouse_total_income > japan_pit_spouse_income_limit or japan_pit_taxpayer_total_income > japan_pit_spouse_taxpayer_eligibility_upper:
              0
          else:
              if japan_pit_taxpayer_total_income <= japan_pit_spouse_taxpayer_first_tier_upper:
                  if japan_pit_spouse_is_elderly:
                      japan_pit_spouse_elderly_full_amount
                  else:
                      japan_pit_spouse_regular_full_amount
              else:
                  if japan_pit_taxpayer_total_income <= japan_pit_spouse_taxpayer_second_tier_upper:
                      if japan_pit_spouse_is_elderly:
                          japan_pit_spouse_elderly_middle_amount
                      else:
                          japan_pit_spouse_regular_middle_amount
                  else:
                      if japan_pit_spouse_is_elderly:
                          japan_pit_spouse_elderly_high_amount
                      else:
                          japan_pit_spouse_regular_high_amount
