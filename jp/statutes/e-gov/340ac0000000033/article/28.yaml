format: rulespec/v1
module:
  summary: >-
    Income Tax Act article 28 employment income from the 2017-04-01 boundary
    through the latest enacted rules, including the separate 2028-onward
    minimum. Gross employment receipts
    below JPY 6.6 million use statutory Schedule 5 and its JPY 4,000 bands.
    The module includes the 2020 schedule and cap reform, the 2025 minimum
    deduction increase, and the enacted 2026 minimum and transition table.
  source_verification:
    corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/28
    source_sha256: 328d5dfb252bc80b801a1245c1c0017bc716ff10808849428b05053add14986e
  proof_validation:
    required: true
units:
  - name: JPY
    kind: currency
    minor_units: 0
