              if japan_employment_gross_cash_earnings < japan_employment_income_2020_linear_upper_exclusive:
                  japan_employment_gross_cash_earnings - japan_employment_income_modern_minimum_deduction
              else:
                  if japan_employment_gross_cash_earnings < japan_employment_income_2020_special_1069_upper_exclusive:
                      japan_employment_income_2020_special_1069_amount
                  else:
                      if japan_employment_gross_cash_earnings < japan_employment_income_2020_special_1070_upper_exclusive:
                          japan_employment_income_2020_special_1070_amount
                      else:
                          if japan_employment_gross_cash_earnings < japan_employment_income_2020_special_1072_upper_exclusive:
                              japan_employment_income_2020_special_1072_amount
                          else:
                              if japan_employment_gross_cash_earnings < japan_employment_income_2020_special_1074_upper_exclusive:
                                  japan_employment_income_2020_special_1074_amount
                              else:
                                  if japan_employment_gross_cash_earnings <= japan_employment_income_first_bracket_upper_threshold:
                                      japan_employment_income_schedule_rounded_receipts - (japan_employment_income_schedule_rounded_receipts * japan_employment_income_first_deduction_rate - japan_employment_income_modern_first_offset)
                                  else:
                                      if japan_employment_gross_cash_earnings <= japan_employment_income_second_bracket_upper_threshold:
                                          japan_employment_income_schedule_rounded_receipts - (japan_employment_income_schedule_rounded_receipts * japan_employment_income_second_deduction_rate + japan_employment_income_modern_second_base)
                                      else:
                                          if japan_employment_gross_cash_earnings < japan_employment_income_third_bracket_upper_threshold:
                                              japan_employment_income_schedule_rounded_receipts - (japan_employment_income_schedule_rounded_receipts * japan_employment_income_third_deduction_rate + japan_employment_income_modern_third_base)
                                          else:
                                              if japan_employment_gross_cash_earnings <= japan_employment_income_modern_cap_threshold:
                                                  floor(japan_employment_gross_cash_earnings - (japan_employment_gross_cash_earnings * japan_employment_income_fourth_deduction_rate + japan_employment_income_modern_fourth_base))
                                              else:
                                                  japan_employment_gross_cash_earnings - japan_employment_income_modern_deduction_cap
      - effective_from: '2025-01-01'
        formula: |-
          if japan_employment_gross_cash_earnings <= japan_employment_income_modern_minimum_upper_threshold:
              max(0, japan_employment_gross_cash_earnings - japan_employment_income_modern_minimum_deduction)
          else:
              if japan_employment_gross_cash_earnings <= japan_employment_income_second_bracket_upper_threshold:
                  japan_employment_income_schedule_rounded_receipts - (japan_employment_income_schedule_rounded_receipts * japan_employment_income_second_deduction_rate + japan_employment_income_modern_second_base)
              else:
                  if japan_employment_gross_cash_earnings < japan_employment_income_third_bracket_upper_threshold:
                      japan_employment_income_schedule_rounded_receipts - (japan_employment_income_schedule_rounded_receipts * japan_employment_income_third_deduction_rate + japan_employment_income_modern_third_base)
                  else:
                      if japan_employment_gross_cash_earnings <= japan_employment_income_modern_cap_threshold:
