              else:
                  if japan_employment_gross_cash_earnings < japan_employment_income_schedule_969_upper_exclusive:
                      japan_employment_income_schedule_969_amount
                  else:
                      if japan_employment_gross_cash_earnings < japan_employment_income_schedule_970_upper_exclusive:
                          japan_employment_income_schedule_970_amount
                      else:
                          if japan_employment_gross_cash_earnings < japan_employment_income_schedule_972_upper_exclusive:
                              japan_employment_income_schedule_972_amount
                          else:
                              if japan_employment_gross_cash_earnings < japan_employment_income_schedule_974_upper_exclusive:
                                  japan_employment_income_schedule_974_amount
                              else:
                                  if japan_employment_gross_cash_earnings < japan_employment_income_first_bracket_upper_threshold:
                                      japan_employment_income_schedule_rounded_receipts - japan_employment_income_schedule_rounded_receipts * japan_employment_income_first_deduction_rate
                                  else:
                                      if japan_employment_gross_cash_earnings < japan_employment_income_second_bracket_upper_threshold:
                                          japan_employment_income_schedule_rounded_receipts - (japan_employment_income_second_deduction_base + (japan_employment_income_schedule_rounded_receipts - japan_employment_income_first_bracket_upper_threshold) * japan_employment_income_second_deduction_rate)
                                      else:
                                          if japan_employment_gross_cash_earnings < japan_employment_income_third_bracket_upper_threshold:
                                              japan_employment_income_schedule_rounded_receipts - (japan_employment_income_third_deduction_base + (japan_employment_income_schedule_rounded_receipts - japan_employment_income_second_bracket_upper_threshold) * japan_employment_income_third_deduction_rate)
                                          else:
                                              if japan_employment_gross_cash_earnings <= japan_employment_income_fourth_bracket_upper_threshold:
                                                  floor(japan_employment_gross_cash_earnings - (japan_employment_income_fourth_deduction_base + (japan_employment_gross_cash_earnings - japan_employment_income_third_bracket_upper_threshold) * japan_employment_income_fourth_deduction_rate))
                                              else:
                                                  japan_employment_gross_cash_earnings - japan_employment_income_deduction_cap
      - effective_from: '2020-01-01'
        formula: |-
          if japan_employment_gross_cash_earnings < japan_employment_income_2020_zero_upper_exclusive:
              0
