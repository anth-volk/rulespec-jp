format: rulespec/v1
module:
  summary: >-
    Income Tax Act article 28 employment income for the law consolidated on
    2017-04-01. Gross employment receipts below JPY 6.6 million use statutory
    Schedule 5, including its exceptional low-income rows and JPY 4,000 bands;
    receipts at or above JPY 6.6 million use article 28 paragraph 3.
  source_verification:
    corpus_citation_path: jp/statute/e-gov/340ac0000000033/as-of/2017-04-01/article/28
    source_sha256: 328d5dfb252bc80b801a1245c1c0017bc716ff10808849428b05053add14986e
  proof_validation:
    required: true
units:
  - name: JPY
    kind: currency
    minor_units: 0
