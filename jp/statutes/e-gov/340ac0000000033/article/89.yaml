  - name: japan_national_income_tax_article_89_base_tax
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_pit_taxable_general_income <= japan_pit_first_bracket_upper_threshold:
              japan_pit_taxable_general_income * japan_pit_first_bracket_rate
          else:
              if japan_pit_taxable_general_income <= japan_pit_second_bracket_upper_threshold:
                  japan_pit_first_bracket_upper_threshold * japan_pit_first_bracket_rate + (japan_pit_taxable_general_income - japan_pit_first_bracket_upper_threshold) * japan_pit_second_bracket_rate
              else:
                  if japan_pit_taxable_general_income <= japan_pit_third_bracket_upper_threshold:
                      japan_pit_first_bracket_upper_threshold * japan_pit_first_bracket_rate + (japan_pit_second_bracket_upper_threshold - japan_pit_first_bracket_upper_threshold) * japan_pit_second_bracket_rate + (japan_pit_taxable_general_income - japan_pit_second_bracket_upper_threshold) * japan_pit_third_bracket_rate
                  else:
                      if japan_pit_taxable_general_income <= japan_pit_fourth_bracket_upper_threshold:
                          japan_pit_first_bracket_upper_threshold * japan_pit_first_bracket_rate + (japan_pit_second_bracket_upper_threshold - japan_pit_first_bracket_upper_threshold) * japan_pit_second_bracket_rate + (japan_pit_third_bracket_upper_threshold - japan_pit_second_bracket_upper_threshold) * japan_pit_third_bracket_rate + (japan_pit_taxable_general_income - japan_pit_third_bracket_upper_threshold) * japan_pit_fourth_bracket_rate
                      else:
                          if japan_pit_taxable_general_income <= japan_pit_fifth_bracket_upper_threshold:
                              japan_pit_first_bracket_upper_threshold * japan_pit_first_bracket_rate + (japan_pit_second_bracket_upper_threshold - japan_pit_first_bracket_upper_threshold) * japan_pit_second_bracket_rate + (japan_pit_third_bracket_upper_threshold - japan_pit_second_bracket_upper_threshold) * japan_pit_third_bracket_rate + (japan_pit_fourth_bracket_upper_threshold - japan_pit_third_bracket_upper_threshold) * japan_pit_fourth_bracket_rate + (japan_pit_taxable_general_income - japan_pit_fourth_bracket_upper_threshold) * japan_pit_fifth_bracket_rate
                          else:
                              if japan_pit_taxable_general_income <= japan_pit_sixth_bracket_upper_threshold:
                                  japan_pit_first_bracket_upper_threshold * japan_pit_first_bracket_rate + (japan_pit_second_bracket_upper_threshold - japan_pit_first_bracket_upper_threshold) * japan_pit_second_bracket_rate + (japan_pit_third_bracket_upper_threshold - japan_pit_second_bracket_upper_threshold) * japan_pit_third_bracket_rate + (japan_pit_fourth_bracket_upper_threshold - japan_pit_third_bracket_upper_threshold) * japan_pit_fourth_bracket_rate + (japan_pit_fifth_bracket_upper_threshold - japan_pit_fourth_bracket_upper_threshold) * japan_pit_fifth_bracket_rate + (japan_pit_taxable_general_income - japan_pit_fifth_bracket_upper_threshold) * japan_pit_sixth_bracket_rate
                              else:
                                  japan_pit_first_bracket_upper_threshold * japan_pit_first_bracket_rate + (japan_pit_second_bracket_upper_threshold - japan_pit_first_bracket_upper_threshold) * japan_pit_second_bracket_rate + (japan_pit_third_bracket_upper_threshold - japan_pit_second_bracket_upper_threshold) * japan_pit_third_bracket_rate + (japan_pit_fourth_bracket_upper_threshold - japan_pit_third_bracket_upper_threshold) * japan_pit_fourth_bracket_rate + (japan_pit_fifth_bracket_upper_threshold - japan_pit_fourth_bracket_upper_threshold) * japan_pit_fifth_bracket_rate + (japan_pit_sixth_bracket_upper_threshold - japan_pit_fifth_bracket_upper_threshold) * japan_pit_sixth_bracket_rate + (japan_pit_taxable_general_income - japan_pit_sixth_bracket_upper_threshold) * japan_pit_top_bracket_rate
