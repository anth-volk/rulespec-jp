format: rulespec/v1
imports:
  - jp:statutes/e-gov/340ac0000000033/article/5
module:
  summary: >-
    Specific-relative special deduction created for 2025. The candidate rule
    encodes the age, household, relationship, and income tests for one
    relative. A separate count-based rule supports multiple qualifying
    relatives in each statutory income band without silently collapsing the
    tax unit.
  source_verification:
    corpus_citation_path: jp/guidance/nta/income-tax/reform/2025/document-1
    source_sha256: 65dcba8b415e2ff86ad7162132ae57bcc4aefa40ee836663eb981e84016ec6c5
  proof_validation:
    required: true
units:
  - {name: JPY, kind: currency, minor_units: 0}
