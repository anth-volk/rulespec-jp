  - name: japan_pit_specific_relative_special_deduction_for_candidate
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    versions:
      - {effective_from: '2017-04-01', formula: '0'}
      - effective_from: '2025-01-01'
        formula: |-
          if not japan_pit_standard_resident_liability_applies or not japan_pit_specific_relative_meets_non_income_conditions or japan_pit_specific_relative_age < japan_pit_specific_relative_age_lower or japan_pit_specific_relative_age >= japan_pit_specific_relative_age_upper_exclusive or japan_pit_specific_relative_total_income <= japan_pit_specific_relative_special_lower_exclusive or japan_pit_specific_relative_total_income > japan_pit_specific_relative_special_upper:
              0
          else:
              if japan_pit_specific_relative_total_income <= japan_pit_specific_relative_band_1_upper:
                  japan_pit_specific_relative_amount_1
              else:
                  if japan_pit_specific_relative_total_income <= japan_pit_specific_relative_band_2_upper:
                      japan_pit_specific_relative_amount_2
                  else:
                      if japan_pit_specific_relative_total_income <= japan_pit_specific_relative_band_3_upper:
                          japan_pit_specific_relative_amount_3
                      else:
                          if japan_pit_specific_relative_total_income <= japan_pit_specific_relative_band_4_upper:
                              japan_pit_specific_relative_amount_4
                          else:
                              if japan_pit_specific_relative_total_income <= japan_pit_specific_relative_band_5_upper:
                                  japan_pit_specific_relative_amount_5
                              else:
                                  if japan_pit_specific_relative_total_income <= japan_pit_specific_relative_band_6_upper:
                                      japan_pit_specific_relative_amount_6
                                  else:
                                      if japan_pit_specific_relative_total_income <= japan_pit_specific_relative_band_7_upper:
                                          japan_pit_specific_relative_amount_7
                                      else:
                                          if japan_pit_specific_relative_total_income <= japan_pit_specific_relative_band_8_upper:
                                              japan_pit_specific_relative_amount_8
                                          else:
                                              japan_pit_specific_relative_amount_9
  - name: japan_pit_specific_relative_special_deduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    versions:
      - {effective_from: '2017-04-01', formula: '0'}
      - effective_from: '2025-01-01'
        formula: |-
          if japan_pit_standard_resident_liability_applies:
              japan_pit_specific_relative_band_1_count * japan_pit_specific_relative_amount_1 + japan_pit_specific_relative_band_2_count * japan_pit_specific_relative_amount_2 + japan_pit_specific_relative_band_3_count * japan_pit_specific_relative_amount_3 + japan_pit_specific_relative_band_4_count * japan_pit_specific_relative_amount_4 + japan_pit_specific_relative_band_5_count * japan_pit_specific_relative_amount_5 + japan_pit_specific_relative_band_6_count * japan_pit_specific_relative_amount_6 + japan_pit_specific_relative_band_7_count * japan_pit_specific_relative_amount_7 + japan_pit_specific_relative_band_8_count * japan_pit_specific_relative_amount_8 + japan_pit_specific_relative_band_9_count * japan_pit_specific_relative_amount_9
          else:
              0
