format: rulespec/v1
module:
  summary: >-
    Employees' Pension standard bonus amount: discard amounts below 1,000 yen
    and cap each month's standard bonus at 1,500,000 yen.
  source_verification:
    corpus_citation_path: jp/statute/e-gov/329ac0000000115/as-of/2017-04-01/article/24-4
    source_sha256: ee144fcc1c622b3d067afdb944ee1505321ff5663988250b50279c02547714d2
  proof_validation:
    required: true
units:
  - {name: JPY, kind: currency, minor_units: 0}
rules:
  - name: japan_employees_pension_standard_bonus_rounding_unit
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/329ac0000000115/as-of/2017-04-01/article/24-4, excerpt: 千円未満の端数を生じたときはこれを切り捨て}}
    versions:
      - {effective_from: '2017-04-01', formula: '1000'}
  - name: japan_employees_pension_standard_bonus_cap
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/329ac0000000115/as-of/2017-04-01/article/24-4, excerpt: 当該標準賞与額が百五十万円}}
          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/502co0000000246/as-of/2020-09-01/article/2, excerpt: 政令で定める額は、百五十万円}}
    versions:
      - {effective_from: '2017-04-01', formula: '1500000'}
      - {effective_from: '2020-09-01', formula: '1500000'}
  - name: japan_employees_pension_standard_bonus_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          min(japan_employees_pension_standard_bonus_cap,
          floor(japan_employees_pension_gross_bonus
          / japan_employees_pension_standard_bonus_rounding_unit)
          * japan_employees_pension_standard_bonus_rounding_unit)
