format: rulespec/v1
module:
  summary: >-
    Employees' Pension standard monthly remuneration bands from 平成29年4月,
    including the 令和2年9月 addition of grade 32 by Cabinet Order No. 246.
    The remuneration-month amount used to assign a band remains an explicit
    factual input because articles 21 through 24 determine it from payroll
    circumstances.
