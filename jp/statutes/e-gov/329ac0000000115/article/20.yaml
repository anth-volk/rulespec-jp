    corpus_citation_path: jp/statute/e-gov/329ac0000000115/as-of/2017-04-01/article/20
    source_sha256: ee144fcc1c622b3d067afdb944ee1505321ff5663988250b50279c02547714d2
  proof_validation:
    required: true
units:
  - {name: JPY, kind: currency, minor_units: 0}
