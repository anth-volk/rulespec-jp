  - name: japan_employees_pension_standard_monthly_remuneration_through_grade_31
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: formula, source: {corpus_citation_path: jp/statute/e-gov/329ac0000000115/as-of/2017-04-01/article/20, excerpt: 被保険者の報酬月額に基づき、次の等級区分}}
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_employees_pension_monthly_remuneration < (japan_employees_pension_standard_remuneration_band_01 + japan_employees_pension_standard_remuneration_band_02) / 2:
              japan_employees_pension_standard_remuneration_band_01
          else:
              if japan_employees_pension_monthly_remuneration < (japan_employees_pension_standard_remuneration_band_02 + japan_employees_pension_standard_remuneration_band_03) / 2:
                  japan_employees_pension_standard_remuneration_band_02
              else:
                  if japan_employees_pension_monthly_remuneration < (japan_employees_pension_standard_remuneration_band_03 + japan_employees_pension_standard_remuneration_band_04) / 2:
                      japan_employees_pension_standard_remuneration_band_03
                  else:
                      if japan_employees_pension_monthly_remuneration < (japan_employees_pension_standard_remuneration_band_04 + japan_employees_pension_standard_remuneration_band_05) / 2:
                          japan_employees_pension_standard_remuneration_band_04
                      else:
                          if japan_employees_pension_monthly_remuneration < (japan_employees_pension_standard_remuneration_band_05 + japan_employees_pension_standard_remuneration_band_06) / 2:
                              japan_employees_pension_standard_remuneration_band_05
                          else:
                              if japan_employees_pension_monthly_remuneration < (japan_employees_pension_standard_remuneration_band_06 + japan_employees_pension_standard_remuneration_band_07) / 2:
                                  japan_employees_pension_standard_remuneration_band_06
                              else:
                                  if japan_employees_pension_monthly_remuneration < (japan_employees_pension_standard_remuneration_band_07 + japan_employees_pension_standard_remuneration_band_08) / 2:
                                      japan_employees_pension_standard_remuneration_band_07
                                  else:
                                      if japan_employees_pension_monthly_remuneration < (japan_employees_pension_standard_remuneration_band_08 + japan_employees_pension_standard_remuneration_band_09) / 2:
                                          japan_employees_pension_standard_remuneration_band_08
                                      else:
                                          if japan_employees_pension_monthly_remuneration < (japan_employees_pension_standard_remuneration_band_09 + japan_employees_pension_standard_remuneration_band_10) / 2:
