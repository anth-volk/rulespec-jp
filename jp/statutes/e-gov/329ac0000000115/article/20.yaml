                                              else:
                                                  if japan_employees_pension_monthly_remuneration < (japan_employees_pension_standard_remuneration_band_11 + japan_employees_pension_standard_remuneration_band_12) / 2:
                                                      japan_employees_pension_standard_remuneration_band_11
                                                  else:
