format: rulespec/v1
imports:
  - jp:statutes/e-gov/329ac0000000115/article/20
  - jp:statutes/e-gov/329ac0000000115/article/24-4
module:
  summary: >-
    Employees' Pension monthly and bonus contributions for ordinary
    first-category insured employees from 平成29年4月. The total statutory rate,
    equal employee/employer split, standard-remuneration bases, and official
    one-yen rounding treatments are encoded. Special public-sector and
    private-school transitional rates are outside this ordinary-employee path.
  source_verification:
    corpus_citation_path: jp/statute/e-gov/329ac0000000115/as-of/2017-04-01/article/81
    source_sha256: ee144fcc1c622b3d067afdb944ee1505321ff5663988250b50279c02547714d2
  proof_validation:
    required: true
units:
  - {name: JPY, kind: currency, minor_units: 0}
rules:
  - name: japan_employees_pension_total_contribution_rate
    kind: parameter
    dtype: Rate
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/329ac0000000115/as-of/2017-04-01/article/81, excerpt: 平成二十八年九月から平成二十九年八月までの月分千分の百八十一・八二}}
          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/329ac0000000115/as-of/2017-04-01/article/81, excerpt: 平成二十九年九月以後の月分千分の百八十三・〇〇}}
    versions:
      - {effective_from: '2017-04-01', formula: '0.18182'}
      - {effective_from: '2017-09-01', formula: '0.183'}
  - name: japan_employees_pension_employee_share
    kind: parameter
    dtype: Rate
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/statute/e-gov/329ac0000000115/as-of/2017-04-01/article/82, excerpt: 被保険者及び被保険者を使用する事業主は、それぞれ保険料の半額を負担する}}
    versions:
      - {effective_from: '2017-04-01', formula: '0.5'}
  - name: japan_employees_pension_total_monthly_contribution
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: formula, source: {corpus_citation_path: jp/statute/e-gov/329ac0000000115/as-of/2017-04-01/article/81, excerpt: 標準報酬月額及び標準賞与額にそれぞれ保険料率を乗じて得た額}}
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          japan_employees_pension_standard_monthly_remuneration
          * japan_employees_pension_total_contribution_rate
  - name: japan_employees_pension_total_bonus_contribution
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          japan_employees_pension_standard_bonus_amount
          * japan_employees_pension_total_contribution_rate
  - name: japan_employees_pension_employee_monthly_share_before_rounding
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          japan_employees_pension_total_monthly_contribution
          * japan_employees_pension_employee_share
  - name: japan_employees_pension_employee_bonus_share_before_rounding
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          japan_employees_pension_total_bonus_contribution
          * japan_employees_pension_employee_share
  - name: japan_employees_pension_employee_monthly_contribution
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: formula, source: {corpus_citation_path: jp/guidance/jps/employees-pension/contribution-calculation/block-4, excerpt: 被保険者負担分の端数が 50銭以下 の場合は切り捨て}}
          - {path: "versions[0].formula", kind: formula, source: {corpus_citation_path: jp/guidance/jps/employees-pension/contribution-calculation/block-5, excerpt: 被保険者負担分の端数が 50銭未満 の場合は切り捨て、 50銭以上 の場合は切り上げて1円}}
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_employees_pension_employee_pays_share_in_cash:
              floor(japan_employees_pension_employee_monthly_share_before_rounding + 0.5)
          else:
              if japan_employees_pension_employee_monthly_share_before_rounding - floor(japan_employees_pension_employee_monthly_share_before_rounding) <= 0.5:
                  floor(japan_employees_pension_employee_monthly_share_before_rounding)
              else:
                  floor(japan_employees_pension_employee_monthly_share_before_rounding) + 1
  - name: japan_employees_pension_employee_bonus_contribution
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_employees_pension_employee_pays_share_in_cash:
              floor(japan_employees_pension_employee_bonus_share_before_rounding + 0.5)
          else:
              if japan_employees_pension_employee_bonus_share_before_rounding - floor(japan_employees_pension_employee_bonus_share_before_rounding) <= 0.5:
                  floor(japan_employees_pension_employee_bonus_share_before_rounding)
              else:
                  floor(japan_employees_pension_employee_bonus_share_before_rounding) + 1
  - name: japan_employees_pension_employee_total_contribution
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_employees_pension_is_ordinary_covered_employee:
              japan_employees_pension_employee_monthly_contribution + japan_employees_pension_employee_bonus_contribution
          else:
              0
