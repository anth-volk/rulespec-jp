    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/tables/2020/document-1, excerpt: "100％ 1,955,000 円 1,855,000 円 1,755,000 円"}}
    versions: [{effective_from: '2020-01-01', formula: '1955000'}]
  - name: japan_public_pension_modern_other_income_deduction_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    versions:
      - effective_from: '2020-01-01'
        formula: |-
          if japan_public_pension_other_income_excluding_public_pension <= japan_public_pension_modern_other_income_first_upper:
              0
          else:
              if japan_public_pension_other_income_excluding_public_pension <= japan_public_pension_modern_other_income_second_upper:
                  japan_public_pension_modern_other_income_deduction_step
              else:
                  japan_public_pension_modern_other_income_deduction_step * 2
  - name: japan_public_pension_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: japan_public_pension_income_2017_rules
      - effective_from: '2020-01-01'
        formula: |-
          if japan_public_pension_recipient_age_at_statutory_test_date < japan_public_pension_age_special_rule_threshold:
              if japan_public_pension_gross_receipts < japan_public_pension_modern_under_65_first_upper:
                  max(0, japan_public_pension_gross_receipts - (japan_public_pension_modern_under_65_minimum_deduction - japan_public_pension_modern_other_income_deduction_reduction))
              else:
                  if japan_public_pension_gross_receipts < japan_public_pension_modern_second_upper:
                      floor(max(0, japan_public_pension_gross_receipts * japan_public_pension_modern_75_percent_rate - (japan_public_pension_modern_75_percent_offset - japan_public_pension_modern_other_income_deduction_reduction)))
                  else:
                      if japan_public_pension_gross_receipts < japan_public_pension_modern_third_upper:
                          floor(max(0, japan_public_pension_gross_receipts * japan_public_pension_modern_85_percent_rate - (japan_public_pension_modern_85_percent_offset - japan_public_pension_modern_other_income_deduction_reduction)))
                      else:
                          if japan_public_pension_gross_receipts < japan_public_pension_modern_fourth_upper:
                              floor(max(0, japan_public_pension_gross_receipts * japan_public_pension_modern_95_percent_rate - (japan_public_pension_modern_95_percent_offset - japan_public_pension_modern_other_income_deduction_reduction)))
                          else:
                              max(0, japan_public_pension_gross_receipts - (japan_public_pension_modern_cap_deduction - japan_public_pension_modern_other_income_deduction_reduction))
          else:
              if japan_public_pension_gross_receipts < japan_public_pension_modern_age_65_first_upper:
                  max(0, japan_public_pension_gross_receipts - (japan_public_pension_modern_age_65_minimum_deduction - japan_public_pension_modern_other_income_deduction_reduction))
              else:
                  if japan_public_pension_gross_receipts < japan_public_pension_modern_second_upper:
                      floor(max(0, japan_public_pension_gross_receipts * japan_public_pension_modern_75_percent_rate - (japan_public_pension_modern_75_percent_offset - japan_public_pension_modern_other_income_deduction_reduction)))
                  else:
                      if japan_public_pension_gross_receipts < japan_public_pension_modern_third_upper:
                          floor(max(0, japan_public_pension_gross_receipts * japan_public_pension_modern_85_percent_rate - (japan_public_pension_modern_85_percent_offset - japan_public_pension_modern_other_income_deduction_reduction)))
                      else:
                          if japan_public_pension_gross_receipts < japan_public_pension_modern_fourth_upper:
                              floor(max(0, japan_public_pension_gross_receipts * japan_public_pension_modern_95_percent_rate - (japan_public_pension_modern_95_percent_offset - japan_public_pension_modern_other_income_deduction_reduction)))
                          else:
                              max(0, japan_public_pension_gross_receipts - (japan_public_pension_modern_cap_deduction - japan_public_pension_modern_other_income_deduction_reduction))
  - name: japan_public_pension_deduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: max(0, japan_public_pension_gross_receipts - japan_public_pension_income)
