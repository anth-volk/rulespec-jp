  - name: japan_employment_insurance_employee_rate
    kind: derived
    entity: Person
    dtype: Rate
    period: Month
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_employment_insurance_is_construction_business:
              japan_employment_insurance_construction_business_employee_rate
          else:
              if japan_employment_insurance_is_agriculture_fisheries_or_sake_business:
                  japan_employment_insurance_agriculture_fisheries_sake_employee_rate
              else:
                  japan_employment_insurance_general_business_employee_rate
  - name: japan_employment_insurance_employee_contribution_before_rounding
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: japan_employment_insurance_covered_wages_paid * japan_employment_insurance_employee_rate
  - name: japan_employment_insurance_employee_contribution
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: jp/guidance/mhlw/employment-insurance/rounding/block-2
              excerpt: 50銭以下の場合は切り捨て、50銭1厘以上の場合は切り上げること
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_employment_insurance_is_withheld_from_wages:
              floor(japan_employment_insurance_employee_contribution_before_rounding + 0.4995)
          else:
              floor(japan_employment_insurance_employee_contribution_before_rounding + 0.5)
