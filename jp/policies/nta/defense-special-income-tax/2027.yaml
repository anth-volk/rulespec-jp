format: rulespec/v1
imports:
  - jp:statutes/e-gov/340ac0000000033/article/89
  - jp:statutes/e-gov/423ac0000000117/article/13
module:
  summary: >-
    Defense Special Income Tax enacted for income arising from 2027 onward.
    It is 1% of base national income tax. Together with the reformed 1.1%
    Reconstruction Special Income Tax, the aggregate national surtax rate
    remains 2.1%.
  source_verification:
    corpus_citation_path: jp/guidance/nta/income-tax/reform/2026/document-1
    source_sha256: 8db585cd5feef2eb29109a16a2e7b16054a0fa4d6423ac622d9ea12c54b39945
  proof_validation:
    required: true
units:
  - {name: JPY, kind: currency, minor_units: 0}
rules:
  - name: japan_defense_special_income_tax_rate
    kind: parameter
    dtype: Rate
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/guidance/nta/income-tax/reform/2026/document-1, excerpt: "源泉徴収すべき所得税の額の１％相当額"}}
    versions:
      - {effective_from: '2027-01-01', formula: '0.01'}
  - name: japan_defense_special_income_tax
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    versions:
      - {effective_from: '2017-04-01', formula: '0'}
      - effective_from: '2027-01-01'
        formula: floor(japan_national_income_tax_after_common_credits * japan_defense_special_income_tax_rate)
  - name: japan_national_income_tax_including_national_surtaxes
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: japan_national_income_tax_including_reconstruction_tax
      - effective_from: '2027-01-01'
        formula: japan_national_income_tax_including_reconstruction_tax + japan_defense_special_income_tax
