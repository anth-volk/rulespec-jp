  - name: japan_special_child_rearing_allowance_monthly
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if not japan_special_child_rearing_allowance_meets_nonfinancial_conditions:
              0
          else:
              if japan_special_child_rearing_allowance_claimant_adjusted_income >= japan_special_child_rearing_allowance_claimant_income_limit:
                  0
              else:
                  if japan_special_child_rearing_allowance_highest_supporter_adjusted_income >= japan_disability_allowance_supporter_income_limit:
                      0
                  else:
                      japan_special_child_rearing_allowance_grade_one_child_count * japan_special_child_rearing_allowance_grade_one_monthly_amount + japan_special_child_rearing_allowance_grade_two_child_count * japan_special_child_rearing_allowance_grade_two_monthly_amount
