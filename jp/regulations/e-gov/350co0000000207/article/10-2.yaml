format: rulespec/v1
imports:
  - jp:regulations/e-gov/350co0000000207/article/2
  - jp:regulations/e-gov/350co0000000207/article/7
module:
  summary: >-
    Monthly Special Disability Allowance from 平成29年4月 through 令和8年4月,
    with claimant and spouse/supporter income restrictions.
  source_verification:
    corpus_citation_path: jp/regulation/e-gov/350co0000000207/as-of/2017-04-01/article/10-2
    source_sha256: 553ad82897fd35cda65622471d73d090d8dd030e8c62d6cb5ac67bdae62adaf2
  proof_validation:
    required: true
units:
  - name: JPY
    kind: currency
    minor_units: 0
rules:
  - name: japan_special_disability_allowance_monthly_amount
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/350co0000000207/as-of/2017-04-01/article/10-2, excerpt: 二万六千八百十円}}
          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/350co0000000207/as-of/2018-04-01/article/10-2, excerpt: 二万六千九百四十円}}
          - {path: "versions[2].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/350co0000000207/as-of/2019-04-01/article/10-2, excerpt: 二万七千二百円}}
          - {path: "versions[3].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/350co0000000207/as-of/2020-04-01/article/10-2, excerpt: 二万七千三百五十円}}
          - {path: "versions[4].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/350co0000000207/as-of/2022-04-01/article/10-2, excerpt: 二万七千三百円}}
          - {path: "versions[5].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/350co0000000207/as-of/2023-04-01/article/10-2, excerpt: 二万七千九百八十円}}
          - {path: "versions[6].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/350co0000000207/as-of/2024-04-01/article/10-2, excerpt: 二万八千八百四十円}}
          - {path: "versions[7].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/350co0000000207/as-of/2025-04-01/article/10-2, excerpt: 二万九千五百九十円}}
          - {path: "versions[8].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/350co0000000207/as-of/2026-04-01/article/10-2, excerpt: 三万四百五十円}}
    versions:
      - {effective_from: '2017-04-01', formula: '26810'}
      - {effective_from: '2018-04-01', formula: '26940'}
      - {effective_from: '2019-04-01', formula: '27200'}
      - {effective_from: '2020-04-01', formula: '27350'}
      - {effective_from: '2022-04-01', formula: '27300'}
      - {effective_from: '2023-04-01', formula: '27980'}
      - {effective_from: '2024-04-01', formula: '28840'}
      - {effective_from: '2025-04-01', formula: '29590'}
      - {effective_from: '2026-04-01', formula: '30450'}
  - name: japan_special_disability_allowance_monthly
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if not japan_special_disability_allowance_meets_nonfinancial_conditions:
              0
          else:
              if japan_special_disability_allowance_claimant_adjusted_income >= japan_individual_disability_allowance_claimant_income_limit:
                  0
              else:
                  if japan_special_disability_allowance_highest_supporter_adjusted_income >= japan_disability_allowance_supporter_income_limit:
                      0
                  else:
                      japan_special_disability_allowance_monthly_amount
