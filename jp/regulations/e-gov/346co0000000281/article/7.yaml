format: rulespec/v1
imports:
  - jp:regulations/e-gov/346co0000000281/article/1
module:
  summary: >-
    Child Allowance special-benefit upper income limit from 令和4年6月 until
    the universal 令和6年10月 reform.
  source_verification:
    corpus_citation_path: jp/regulation/e-gov/346co0000000281/as-of/2022-06-01/article/7
    source_sha256: c81a178db0eecb835ac2d2b2d7873b48490e425c9b059a8c665e852a80445714
  proof_validation:
    required: true
units:
  - {name: JPY, kind: currency, minor_units: 0}
rules:
  - name: japan_child_allowance_special_benefit_upper_income_limit_base
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/346co0000000281/as-of/2022-06-01/article/7, excerpt: 扶養親族等及び同項に規定する児童（以下この条において「児童」という。）がないときは八百五十八万円}}
    versions:
      - {effective_from: '2022-06-01', formula: '8580000'}
  - name: japan_child_allowance_special_benefit_upper_income_limit
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2022-06-01'
        formula: >-
          japan_child_allowance_special_benefit_upper_income_limit_base
          + japan_child_allowance_income_limit_per_dependent
          * (japan_child_allowance_ordinary_dependent_count
          + japan_child_allowance_elderly_dependent_count)
          + japan_child_allowance_elderly_dependent_extra
          * japan_child_allowance_elderly_dependent_count
