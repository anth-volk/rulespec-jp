format: rulespec/v1
module:
  summary: >-
    National Pension full application-based exemption income limit under
    Enforcement Order article 6-7, including the 平成33年度/令和3年度 increase.
  source_verification:
    corpus_citation_path: jp/regulation/e-gov/334co0000000184/as-of/2017-04-01/article/6-7
    source_sha256: ed967347b61a984af7aa3b8117f86ad39cef9228c8d91853b04fd849b6bf1f60
  proof_validation:
    required: true
units:
  - {name: JPY, kind: currency, minor_units: 0}
rules:
  - name: japan_national_pension_full_exemption_per_person_factor
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/334co0000000184/as-of/2017-04-01/article/6-7, excerpt: 数を三十五万円に乗じて得た額}}
    versions:
      - {effective_from: '2017-04-01', formula: '350000'}
  - name: japan_national_pension_full_exemption_fixed_addition
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/334co0000000184/as-of/2017-04-01/article/6-7, excerpt: 二十二万円を加算した額}}
          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/334co0000000184/as-of/2021-04-01/article/6-7, excerpt: 三十二万円を加算した額}}
    versions:
      - {effective_from: '2017-04-01', formula: '220000'}
      - {effective_from: '2021-04-01', formula: '320000'}
  - name: japan_national_pension_full_exemption_applicant_income_limit
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: japan_national_pension_full_exemption_per_person_factor * (japan_national_pension_income_test_dependent_count + 1) + japan_national_pension_full_exemption_fixed_addition
