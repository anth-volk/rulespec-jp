format: rulespec/v1
module:
  summary: >-
    National Pension three-quarter exemption (quarter payment) income limit
    under Enforcement Order article 6-8-2 from 平成29年度.
  source_verification:
    corpus_citation_path: jp/regulation/e-gov/334co0000000184/as-of/2017-04-01/article/6-8-2
    source_sha256: ed967347b61a984af7aa3b8117f86ad39cef9228c8d91853b04fd849b6bf1f60
  proof_validation:
    required: true
units:
  - {name: JPY, kind: currency, minor_units: 0}
rules:
  - name: japan_national_pension_three_quarter_exemption_income_base
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/334co0000000184/as-of/2017-04-01/article/6-8-2, excerpt: ないときは七十八万円}}
          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/334co0000000184/as-of/2021-04-01/article/6-8-2, excerpt: ないときは八十八万円}}
    versions:
      - {effective_from: '2017-04-01', formula: '780000'}
      - {effective_from: '2021-04-01', formula: '880000'}
  - name: japan_national_pension_partial_exemption_ordinary_dependent_increment
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/334co0000000184/as-of/2017-04-01/article/6-8-2, excerpt: 一人につき三十八万円}}
    versions:
      - {effective_from: '2017-04-01', formula: '380000'}
  - name: japan_national_pension_partial_exemption_elderly_dependent_increment
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/334co0000000184/as-of/2017-04-01/article/6-8-2, excerpt: 一人につき四十八万円}}
    versions:
      - {effective_from: '2017-04-01', formula: '480000'}
  - name: japan_national_pension_partial_exemption_specified_dependent_increment
    kind: parameter
    dtype: Money
    unit: JPY
    metadata:
      proof:
        atoms:
          - {path: "versions[0].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/334co0000000184/as-of/2017-04-01/article/6-8-2, excerpt: 一人につき六十三万円}}
    versions:
      - {effective_from: '2017-04-01', formula: '630000'}
  - name: japan_national_pension_three_quarter_exemption_applicant_income_limit
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          japan_national_pension_three_quarter_exemption_income_base
          + japan_national_pension_partial_exemption_ordinary_dependent_increment
          * japan_national_pension_ordinary_dependent_count
          + japan_national_pension_partial_exemption_elderly_dependent_increment
          * japan_national_pension_elderly_dependent_count
          + japan_national_pension_partial_exemption_specified_dependent_increment
          * japan_national_pension_specified_dependent_count
