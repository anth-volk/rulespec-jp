  - name: japan_child_rearing_allowance_full_monthly_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          japan_child_rearing_allowance_basic_monthly_amount
          + min(1, max(0, japan_child_rearing_allowance_qualifying_child_count - 1))
          * japan_child_rearing_allowance_first_additional_child_monthly_amount
          + max(0, japan_child_rearing_allowance_qualifying_child_count - 2)
          * japan_child_rearing_allowance_later_additional_child_monthly_amount
