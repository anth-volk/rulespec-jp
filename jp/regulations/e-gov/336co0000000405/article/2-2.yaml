format: rulespec/v1
module:
  summary: >-
    Monthly Child-Rearing Allowance amounts under Enforcement Order article
    2-2 from 平成29年4月 through 令和8年4月, including the November 2024
    unification of every second-and-later-child addition.
  source_verification:
    corpus_citation_path: jp/regulation/e-gov/336co0000000405/as-of/2017-04-01/article/2-2
    source_sha256: 4dca7cf10d4c42970241870640c0f56dca47fd11b0715c6614a2e74106dcf846
  proof_validation:
    required: true
units:
  - name: JPY
    kind: currency
    minor_units: 0
