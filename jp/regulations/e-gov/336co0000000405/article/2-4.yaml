format: rulespec/v1
imports:
  - jp:regulations/e-gov/336co0000000405/article/2-2
module:
  summary: >-
    Child-Rearing Allowance claimant and supporter income limits, treatment of
    child support, partial-payment coefficients, statutory ten-yen rounding,
    and final monthly amount from 平成29年4月. The family-status input represents
    the factual conditions in the Act; this module determines the monetary and
    income-test consequences.
  source_verification:
    corpus_citation_path: jp/regulation/e-gov/336co0000000405/as-of/2017-04-01/article/2-4
    source_sha256: 4dca7cf10d4c42970241870640c0f56dca47fd11b0715c6614a2e74106dcf846
  proof_validation:
    required: true
units:
  - name: JPY
    kind: currency
    minor_units: 0
