          - {path: "versions[1].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/336co0000000405/as-of/2018-08-01/article/2-4, excerpt: 扶養親族等及び児童がないときは、四十九万円}}
          - {path: "versions[2].formula", kind: parameter, source: {corpus_citation_path: jp/regulation/e-gov/336co0000000405/as-of/2024-11-01/article/2-4, excerpt: 及び生計維持児童（法第九条第一項に規定する児童をいう。次号及び次項第一号において同じ。）がないとき六十九万円}}
