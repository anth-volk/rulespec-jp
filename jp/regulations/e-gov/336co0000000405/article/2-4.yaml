  - name: japan_child_rearing_allowance_full_payment_income_limit
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          japan_child_rearing_allowance_full_payment_income_base
          + japan_child_rearing_allowance_income_limit_ordinary_increment
          * japan_child_rearing_allowance_income_limit_person_count
          + japan_child_rearing_allowance_income_limit_elderly_extra
          * japan_child_rearing_allowance_elderly_dependent_count
          + japan_child_rearing_allowance_income_limit_specified_extra
          * japan_child_rearing_allowance_specified_dependent_count
  - name: japan_child_rearing_allowance_partial_payment_income_limit
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          japan_child_rearing_allowance_partial_payment_income_base
          + japan_child_rearing_allowance_income_limit_ordinary_increment
          * japan_child_rearing_allowance_income_limit_person_count
          + japan_child_rearing_allowance_income_limit_elderly_extra
          * japan_child_rearing_allowance_elderly_dependent_count
          + japan_child_rearing_allowance_income_limit_specified_extra
          * japan_child_rearing_allowance_specified_dependent_count
  - name: japan_child_rearing_allowance_supporter_income_limit
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if japan_child_rearing_allowance_supporter_dependent_count == japan_child_rearing_allowance_supporter_elderly_dependent_count:
              japan_child_rearing_allowance_supporter_income_base + japan_child_rearing_allowance_income_limit_ordinary_increment * japan_child_rearing_allowance_supporter_dependent_count + japan_child_rearing_allowance_supporter_elderly_extra * max(0, japan_child_rearing_allowance_supporter_elderly_dependent_count - 1)
          else:
              japan_child_rearing_allowance_supporter_income_base + japan_child_rearing_allowance_income_limit_ordinary_increment * japan_child_rearing_allowance_supporter_dependent_count + japan_child_rearing_allowance_supporter_elderly_extra * japan_child_rearing_allowance_supporter_elderly_dependent_count
  - name: japan_child_rearing_allowance_assessed_income
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          japan_child_rearing_allowance_adjusted_prior_year_income
          + floor(japan_child_rearing_allowance_child_support_received
          * japan_child_rearing_allowance_child_support_inclusion_rate + 0.5)
  - name: japan_child_rearing_allowance_basic_partial_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          floor(((japan_child_rearing_allowance_assessed_income
          - japan_child_rearing_allowance_full_payment_income_limit)
          * japan_child_rearing_allowance_basic_partial_reduction_rate
          + japan_child_rearing_allowance_rounding_half_band)
          / japan_child_rearing_allowance_rounding_band)
          * japan_child_rearing_allowance_rounding_band
          + japan_child_rearing_allowance_rounding_band
  - name: japan_child_rearing_allowance_first_addition_partial_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          floor(((japan_child_rearing_allowance_assessed_income
          - japan_child_rearing_allowance_full_payment_income_limit)
          * japan_child_rearing_allowance_first_addition_partial_reduction_rate
          + japan_child_rearing_allowance_rounding_half_band)
          / japan_child_rearing_allowance_rounding_band)
          * japan_child_rearing_allowance_rounding_band
          + japan_child_rearing_allowance_rounding_band
  - name: japan_child_rearing_allowance_later_addition_partial_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: >-
          floor(((japan_child_rearing_allowance_assessed_income
          - japan_child_rearing_allowance_full_payment_income_limit)
          * japan_child_rearing_allowance_later_addition_partial_reduction_rate
          + japan_child_rearing_allowance_rounding_half_band)
          / japan_child_rearing_allowance_rounding_band)
          * japan_child_rearing_allowance_rounding_band
          + japan_child_rearing_allowance_rounding_band
  - name: japan_child_rearing_allowance_monthly
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: JPY
    versions:
      - effective_from: '2017-04-01'
        formula: |-
          if not japan_child_rearing_allowance_meets_family_conditions:
              0
          else:
              if japan_child_rearing_allowance_qualifying_child_count <= 0:
                  0
              else:
                  if japan_child_rearing_allowance_highest_supporter_adjusted_income >= japan_child_rearing_allowance_supporter_income_limit:
                      0
                  else:
                      if japan_child_rearing_allowance_assessed_income < japan_child_rearing_allowance_full_payment_income_limit:
                          japan_child_rearing_allowance_full_monthly_amount
                      else:
                          if japan_child_rearing_allowance_assessed_income >= japan_child_rearing_allowance_partial_payment_income_limit:
                              0
                          else:
                              max(0, japan_child_rearing_allowance_basic_monthly_amount - japan_child_rearing_allowance_basic_partial_reduction)
                              + min(1, max(0, japan_child_rearing_allowance_qualifying_child_count - 1))
                              * max(0, japan_child_rearing_allowance_first_additional_child_monthly_amount - japan_child_rearing_allowance_first_addition_partial_reduction)
                              + max(0, japan_child_rearing_allowance_qualifying_child_count - 2)
                              * max(0, japan_child_rearing_allowance_later_additional_child_monthly_amount - japan_child_rearing_allowance_later_addition_partial_reduction)
